# Gera o instalador do Modo Aula para Windows.
# Roda sozinho a cada envio (push) e também pelo botão "Run workflow"
# na aba Actions. O instalador fica em Actions → (a execução) → Artifacts.
# Ao criar uma tag v1.0.1, v1.1.0..., também publica em Releases.
name: Instalador Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o instalador
        run: npx tauri build

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Modo-Aula-instalador-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar em Releases (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
